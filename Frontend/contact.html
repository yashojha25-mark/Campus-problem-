<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

    <section class="contact-section">
  <div class="container">
    
    <div class="contact-header">
      <h2>Contact Us</h2>
      <p>Have questions about how to use the portal? Reach out to our support team.</p>
    </div>

    <div class="contact-grid">
    
      <div class="contact-info">
        <h3>Get in Touch</h3>
        <p>If you prefer not to use the form, you can reach us directly via email or phone.</p>
        
        <div class="info-item">
          <strong> Email:</strong> Navgurukul@25.org
        </div>
        <div class="info-item">
          <strong> Phone:</strong> +91 9192939495
        </div>
        <div class="info-item">
          <strong> Hours:</strong> Mon - Sat, 9:00 AM - 8:00 PM
        </div>
      </div>

      
      <div class="contact-form-box">
        <form>
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Damini--" required />
          </div>

          <div class="form-group">
            <label for="email">Your Email</label>
            <input type="email" id="email" placeholder="Damini@example.com" required />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>

  </div>
</section>
  <script src="contact.js" defer></script>
    <script src="theme.js"></script>
    
</body>
</html>
