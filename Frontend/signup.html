<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="theme.css">

</head>
<body>
    <div class="signup">

        <h2>Sign Up</h2>

        <label for="name">Username:</label>
        <input id="name" type="text" placeholder="username">

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="email">

        <label for="password">Password:</label>
        <div class="password-field">
            <input id="password" type="password" placeholder="password">
            <button class="toggle-password" type="button" aria-label="Show password">&#128065;</button>
        </div>
      
        <label for="passw"> Confirm password:</label>
        
        <div class="password-field">
            <input id="passw" type="password" placeholder="confirm password">
            <button class="toggle-password" type="button" aria-label="Show password">&#128065;</button>
        </div>

         <button id="sign">Sign Up</button>

         <p id="message"></p>

         <p class="account-note">
            <span class="account-note__text">Already have an account?</span>
            <a href="login.html" class="btn">Login</a>
         </p>

    </div>

<script src="login.js"></script>
    <script src="theme.js"></script>
</body>
</html>
